services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "3001:3000"  # port 3000 l'ocupa ara l'ajusc; accessible des de tota la xarxa local
    volumes:
      - ./data:/data              # Base de dades SQLite (persistent)
      - ./uploads:/app/public/uploads # Imatges pujades (persistent)
    environment:
      DATA_DIR: /data
    env_file:
      - .env.production           # Crea aquest fitxer al servidor (veure .env.production.example)
