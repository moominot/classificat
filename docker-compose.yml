services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"  # accessible des de tota la xarxa local; posa 127.0.0.1:3000:3000 si algun dia hi poses Nginx/TLS al davant
    volumes:
      - ./data:/data              # Base de dades SQLite (persistent)
      - ./uploads:/app/app/public/uploads  # Imatges pujades (persistent)
    environment:
      DATA_DIR: /data
    env_file:
      - .env.production           # Crea aquest fitxer al servidor (veure .env.production.example)
